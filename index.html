<script type="x-template" id="tpl">
<div>
  <h1>2026 NFL Football — Antenna and Streaming Guide</h1>
  <p class="sub">Six teams, four markets, one date-sorted table. All times Eastern. Today is {{ prettyToday }}.</p>

  <div class="panel">
    <p class="lbl">Market</p>
    <div class="chips">
      <button v-for="(m,k) in markets" :key="k" :class="{on: market===k}" @click="market=k">{{ m.short }}</button>
    </div>
    <p><strong>{{ markets[market].name }}</strong> — {{ teams[markets[market].home].name }}<br/>{{ markets[market].st.CBS }} (CBS) · {{ markets[market].st.NBC }} (NBC) · {{ markets[market].st.ABC }} (ABC) · {{ markets[market].st.FOX }} (FOX)</p>
  </div>

  <div class="panel">
    <p class="lbl">Teams</p>
    <div class="chips">
      <button :class="{on: shown.length===chips.length}" @click="allTeams">All</button>
      <button v-for="teamCode in chips" :key="teamCode" :class="['t-'+teamCode.toLowerCase(), {on: shown.includes(teamCode)}]" @click="toggleTeam(teamCode)">{{ teams[teamCode].name }}</button>
    </div>
    <div class="chips" style="margin-bottom:0">
      <button :class="{on: showHistory}" @click="showHistory=!showHistory">Show History</button>
      <button :class="{on: onlyFree}" @click="onlyFree=!onlyFree">{{ onlyFree ? 'Only Free Games' : 'Only Free Games' }}</button>
    </div>
  </div>

  <div class="panel">
    <p><span class="pill yes fixed">OTA</span> An outlined pill is confirmed against a published listing for this market, not predicted.</p>
    <p><span class="pill yes">Twitch</span> Streaming free on Twitch, and on Prime with a membership.</p>
    <p><span class="pill yes">OTA</span> National, or your market's home team — it will be on a local station.</p>
    <p><span class="pill maybe">Maybe</span> Open window, decided by the weekly FOX/CBS regional pick about 12 days out.</p>
    <p><span class="pill no">No</span> Streaming-exclusive, or the home team has that same network and window.</p>
    <p><span class="pill no fixed">No</span> Confirmed not OTA in your market.</p>
  </div>

  <div class="scroller">
    <table>
      <thead><tr><th>Wk</th><th>Date</th><th>Time</th><th>Teams</th><th>Matchup</th><th>How to watch</th><th>{{ markets[market].short }}</th></tr></thead>
      <tbody>
        <tr v-for="game in visible" :key="game.k" :class="{past: isPast(game), today: game.d===today, bye: game.bye}">
          <td class="wk">{{ game.w }}</td>
          <td class="date">{{ fmtDate(game.d) }}</td>
          <td class="time">{{ game.bye ? '—' : game.t }}</td>
          <td><span v-for="teamCode in game.tm" :key="teamCode" :class="['badge','b-'+teamCode.toLowerCase()]">{{ teamCode }}</span></td>
          <template v-if="game.bye">
            <td colspan="3">Bye week</td>
          </template>
          <template v-else>
            <td class="matchup">{{ game.l }}<span v-if="game.sub" class="note">{{ game.sub }}</span></td>
            <td>{{ getNetworkString(game) }}<span v-if="game.nsub" class="note">{{ game.nsub }}</span></td>
            <td>
              <span :class="['pill', carriage(game).s, {fixed: carriage(game).fixed}]">{{ label(game) }}</span>
              <span class="note">{{ carriage(game).note }}</span>
            </td>
          </template>
        </tr>
      </tbody>
    </table>
  </div>
  <p class="count">{{ gameCount }} games shown · {{ otaCount }} you can watch in {{ markets[market].short }}</p>

  <div class="callout">
    <strong>How the verdict is computed</strong>
    <p style="margin:8px 0 0">Sunday-afternoon games aren't assigned to markets until about 12 days out, so "OTA" and "No" are the cases the rules settle: national windows are always carried, your home team is always carried, and a game is blocked when the home team occupies the same network in the same time slot. Everything else is a genuine "Maybe" — check <em>506 Sports</em> coverage maps the week of.</p>
    <p style="margin:8px 0 0">One simplification: each Sunday only one of FOX or CBS gets a doubleheader, and the single-header network shows just one game in your market. That isn't known this far ahead, so some late-window "Maybe" rows will resolve to no.</p>
  </div>

  <div class="callout">
    <strong>Market notes</strong>
    <ul>
      <li><strong>Roanoke, DC and Norfolk are all Commanders markets</strong> — same home team, but three independent secondary picks. DC is a top-10 market and reliably gets the full doubleheader; Roanoke often doesn't.</li>
      <li><strong>Baltimore is the odd one out</strong>, and that's what makes it useful. The Ravens are AFC, so they eat CBS windows and leave FOX comparatively open — the reverse of your other three.</li>
      <li>Baltimore and DC are adjacent markets and Baltimore stations sometimes pick up Commanders games anyway. Treat Commanders "Maybe" rows in Baltimore as better than even.</li>
    </ul>
  </div>

  <footer>
    Last updated 2026-10-04. Network assignments for Sunday afternoon games follow the visiting conference rule and can be cross-flexed. Weeks 15–18 are subject to flex scheduling; Week 18 times and networks are set in early January. Netflix games simulcast over the air only in the participating teams' home markets — none of which are these four.
    <br/><br/>

      kj4ezj/nfl
    </a>
  </footer>
</div>
</script>

  GAMES.forEach(function(game,i){ game.k = i; });

  function localToday(){
    var n = new Date();
    return n.getFullYear() + '-' +
      String(n.getMonth()+1).padStart(2,'0') + '-' +
      String(n.getDate()).padStart(2,'0');
  }

  var DAY_OF_WEEK = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var MONTH_NAME = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  Vue.createApp({
    template: document.getElementById('tpl').innerHTML,
    data: function(){
      return {
        teams: TEAMS, order: ORDER, chips: CHIPS, markets: MARKETS, games: GAMES,
        market: 'roanoke',
        shown: CHIPS.slice(),
        showHistory: false,
        onlyFree: false,
        today: localToday()
      };
    },
    computed: {
      prettyToday: function(){ return this.fmtDateLong(this.today); },
      visible: function(){
        var self = this;
        return this.games.filter(function(game){
          if (game.tm.length === 0) {
            if (self.shown.indexOf('OTHER') === -1) return false;
          } else if (!game.tm.some(function(teamCode){ return self.shown.indexOf(teamCode) !== -1; })) return false;
          if (!self.showHistory && game.d < self.today) return false;
          if (self.onlyFree && (game.bye || self.carriage(game).s !== 'yes')) return false;
          return true;
        });
      },
      gameCount: function(){ return this.visible.filter(function(game){ return !game.bye; }).length; },
      otaCount: function(){
        var self = this;
        return this.visible.filter(function(game){ return !game.bye && self.carriage(game).s === 'yes'; }).length;
      }
    },
    methods: {
      toggleTeam: function(teamCode){
        if (this.shown.length === CHIPS.length) { this.shown = [teamCode]; return; }
        var i = this.shown.indexOf(teamCode);
        if (i === -1) this.shown.push(teamCode);
        else if (this.shown.length > 1) this.shown.splice(i,1);
      },
      allTeams: function(){ this.shown = CHIPS.slice(); },
      isPast: function(game){ return game.d < this.today; },
      parseDate: function(dateString){
        var datePart = dateString.split('-');
        return new Date(+datePart[0], +datePart[1]-1, +datePart[2]);
      },
      fmtDate: function(dateString){
        var x = this.parseDate(dateString);
        return DAY_OF_WEEK[x.getDay()] + ' ' + MONTH_NAME[x.getMonth()] + ' ' + x.getDate();
      },
      fmtDateLong: function(dateString){
        var x = this.parseDate(dateString);
        return DAY_OF_WEEK[x.getDay()] + ', ' + MONTH_NAME[x.getMonth()] + ' ' + x.getDate() + ', ' + x.getFullYear();
      },
      getNetworkString: function(game){
        var network = game.net;
        if (network === 'ABC')  return 'ABC / ESPN';
        if (network === 'CBS')   return 'CBS / Paramount+';
        if (network === 'NBC')   return 'NBC / Peacock';
        if (network === 'ESPN')  return 'ESPN';
        if (network === 'PRIME') return 'Prime / Twitch';
        if (network === 'NFLX')  return 'Netflix';
        if (network === 'INTL')  return 'International';
        if (network === 'SAT')   return 'Saturday — network TBD';
        if (network === 'TBD')   return 'TBD';
        return network;
      },
      // OTA label ternary
      label: function(game){
        var r = this.carriage(game);
        return r.label || (r.s === 'yes' ? 'OTA' : r.s === 'maybe' ? 'Maybe' : 'No');
      },
      // override first, heuristic second; anything with an `ota` entry for the current market is a published fact and is returned with fixed:true.
      carriage: function(game){
        if (game.bye) return {s:'no', note:'', fixed:false};
        var marketKey = this.market, selectedMarket = MARKETS[marketKey];
        if (game.ota) {
          var override = Object.prototype.hasOwnProperty.call(game.ota, marketKey) ? game.ota[marketKey] : game.ota.all;
          if (override) {
            var on = override.on || (override.s === 'yes' && selectedMarket.st[game.net] ? game.net : null);
            var note = override.note || (on ? selectedMarket.st[on] : '');
            return {s:override.s, label:override.label, note:note, fixed:true};
          }
        }
        var prediction = this.predict(game, marketKey);
        prediction.fixed = false;
        return prediction;
      },
      // rules-based guess, used wherever no listing has been confirmed yet
      predict: function(game, marketKey){
        var selectedMarket = MARKETS[marketKey], home = selectedMarket.home;
        var homeName = TEAMS[home].name;
        var mine = game.tm.indexOf(home) !== -1;
        if (game.net === 'ABC')  return {s:'yes', note:selectedMarket.st.ABC + ' — national'};
        if (game.net === 'NBC')  return {s:'yes', note:selectedMarket.st.NBC + ' — national'};
        if (game.net === 'ESPN') return {s:'no', note:'ESPN exclusive — no ABC simulcast'};
        if (game.net === 'PRIME')return {s:'yes', label:'Twitch', note:'Prime · Free on Twitch'};
        if (game.net === 'NFLX') return {s:'no',  note:'OTA only in participating markets'};
        if (game.net === 'SAT')  return {s:'maybe', note:'network not announced'};
        if (game.net === 'TBD')  return {s:'maybe', note:'flexed — set in January'};
        if (game.net === 'INTL') {
          return mine ? {s:'yes', note:'home-market game'}
                      : {s:'maybe', note:'morning games go near-national'};
        }
        // FOX or CBS Thanksgiving
        if (game.d === THANKSGIVING_DATE) return {s:'yes', note:selectedMarket.st[game.net] + ' — national'};
        // FOX or CBS Sunday afternoon
        if (mine) return {s:'yes', note:selectedMarket.st[game.net]};
        var blocked = GAMES.some(function(g){  // does the market's home team occupy this exact broadcast slot?
          return !g.bye && g.d === game.d && g.net === game.net && g.ts === game.ts &&
                 g.tm.indexOf(home) !== -1;
        });
        if (blocked) return {s:'no', note:homeName + ' have this window'};
        return {s:'maybe', note:'open window — regional pick'};
      }
    }
  }).mount('#app');
