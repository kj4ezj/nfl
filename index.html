    --bg:#000000; --surface:#17181a; --ink:#eceae5; --muted:#9d9a94; --line:#33363a;
    --accent:#6fc294; --rowhl:#25272a;
    --yes-bg:#1d3a2a; --yes-ink:#8fd9b0;
    --maybe-bg:#3b3420; --maybe-ink:#e3c47a;

  .sub{color:var(--muted);font-size:.87rem;margin:0 0 16px}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;

    font-weight:700;margin:0 0 6px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}

  button.t-gb.on{background:var(--gb-bg);color:var(--gb);border-color:var(--gb)}

  button.t-phi.on{background:var(--phi-bg);color:var(--phi);border-color:var(--phi)}

    border-radius:10px;background:var(--surface);margin-top:10px}

  th{text-align:left;font-size:.64rem;text-transform:uppercase;letter-spacing:.06em;
    color:var(--muted);font-weight:700;padding:10px;border-bottom:1px solid var(--line);
    white-space:nowrap;background:var(--surface);position:sticky;top:0;z-index:1}
  td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  tr:last-child td{border-bottom:none}
  tr.past td{opacity:.45}
  tr.today{background:var(--rowhl)}
  tr.bye td{background:var(--bg);font-size:.75rem;color:var(--muted);font-style:italic}
  .wk{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap;font-size:.75rem}
  .date{white-space:nowrap;font-weight:600}
  .time{white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--muted)}
  .badge{display:inline-block;padding:2px 7px;border-radius:5px;font-size:.67rem;
    font-weight:700;letter-spacing:.04em;white-space:nowrap;margin-right:3px}
  .b-det{background:var(--det-bg);color:var(--det)}
  .b-gb{background:var(--gb-bg);color:var(--gb)}
  .b-was{background:var(--was-bg);color:var(--was)}
  .b-bal{background:var(--bal-bg);color:var(--bal)}

  .maybe{background:var(--maybe-bg);color:var(--maybe-ink)}
  .no{background:var(--no-bg);color:var(--no-ink)}

  .count{font-size:.75rem;color:var(--muted);margin-top:10px}

    border-radius:8px;padding:12px 14px;margin:22px 0 0;font-size:.85rem}

<div id="app" class="wrap">
  <div id="fallback">Loading the schedule…</div>
</div>

<script type="x-template" id="tpl">
<div>
  <h1>2026 NFL Viewing Guide</h1>
  <p class="sub">Six teams, four markets, one date-sorted table. All times Eastern. Today is {{ prettyToday }}.</p>

  <div class="panel">
    <p class="lbl">Market</p>
    <div class="chips">
      <button v-for="(m,k) in markets" :key="k" :class="{on: market===k}" @click="market=k">{{ m.short }}</button>
    </div>
    <p><strong>{{ markets[market].name }}</strong> — {{ markets[market].st.FOX }} (FOX) · {{ markets[market].st.CBS }} (CBS) · {{ markets[market].st.NBC }} (NBC) · {{ markets[market].st.ABC }} (ABC). Home team: {{ teams[markets[market].home].name }}.</p>
  </div>

  <div class="panel">
    <p class="lbl">Teams</p>
    <div class="chips">
      <button :class="{on: shown.length===order.length}" @click="allTeams">All</button>
      <button v-for="c in order" :key="c" :class="['t-'+c.toLowerCase(), {on: shown.includes(c)}]" @click="toggle(c)">{{ teams[c].name }}</button>
    </div>
    <div class="chips" style="margin-bottom:0">
      <button :class="{on: hidePast}" @click="hidePast=!hidePast">{{ hidePast ? 'Showing upcoming only' : 'Hide past games' }}</button>
      <button :class="{on: onlyOTA}" @click="onlyOTA=!onlyOTA">{{ onlyOTA ? 'Showing OTA only' : 'Only games I can get' }}</button>
    </div>
  </div>

  <div class="panel">
    <p><span class="pill yes">OTA</span> National, or your market's home team — it will be on a local station.</p>
    <p><span class="pill maybe">Maybe</span> Open window, decided by the weekly FOX/CBS regional pick about 12 days out.</p>
    <p><span class="pill no">No</span> Streaming-exclusive, or the home team has that same network and window.</p>
  </div>

  <div class="scroller">
    <table>
      <thead><tr><th>Wk</th><th>Date</th><th>Time</th><th>Teams</th><th>Matchup</th><th>How to watch</th><th>{{ markets[market].short }}</th></tr></thead>
      <tbody>
        <tr v-for="g in visible" :key="g.k" :class="{past: isPast(g), today: g.d===today, bye: g.bye}">
          <td class="wk">{{ g.w }}</td>
          <td class="date">{{ fmt(g.d) }}</td>
          <td class="time">{{ g.bye ? '—' : g.t }}</td>
          <td><span v-for="c in g.tm" :key="c" :class="['badge','b-'+c.toLowerCase()]">{{ c }}</span></td>
          <template v-if="g.bye">
            <td colspan="3">Bye week</td>
          </template>
          <template v-else>
            <td class="matchup">{{ g.l }}<span v-if="g.sub" class="note">{{ g.sub }}</span></td>
            <td>{{ chan(g) }}<span v-if="g.nsub" class="note">{{ g.nsub }}</span></td>
            <td>
              <span :class="['pill', v(g).s]">{{ v(g).s==='yes' ? 'OTA' : v(g).s==='maybe' ? 'Maybe' : 'No' }}</span>
              <span class="note">{{ v(g).note }}</span>
            </td>
          </template>
        </tr>
      </tbody>
    </table>
  </div>
  <p class="count">{{ gameCount }} games shown · {{ otaCount }} confirmed over the air in {{ markets[market].short }}</p>

  <div class="callout">
    <strong>How the verdict is computed</strong>
    <p style="margin:8px 0 0">Sunday-afternoon games aren't assigned to markets until about 12 days out, so "OTA" and "No" are the cases the rules settle: national windows are always carried, your home team is always carried, and a game is blocked when the home team occupies the same network in the same time slot. Everything else is a genuine "Maybe" — check <em>506 Sports</em> coverage maps the week of.</p>
    <p style="margin:8px 0 0">One simplification: each Sunday only one of FOX or CBS gets a doubleheader, and the single-header network shows just one game in your market. That isn't known this far ahead, so some late-window "Maybe" rows will resolve to no.</p>
  </div>

  <div class="callout">
    <strong>Market notes</strong>
    <ul>
      <li><strong>Roanoke, DC and Norfolk are all Commanders markets</strong> — same home team, but three independent secondary picks. DC is a top-10 market and reliably gets the full doubleheader; Roanoke often doesn't.</li>
      <li><strong>Baltimore is the odd one out</strong>, and that's what makes it useful. The Ravens are AFC, so they eat CBS windows and leave FOX comparatively open — the reverse of your other three.</li>
      <li>Baltimore and DC are adjacent markets and Baltimore stations sometimes pick up Commanders games anyway. Treat Commanders "Maybe" rows in Baltimore as better than even.</li>
    </ul>
  </div>

  <footer>
    Schedule pulled Sep 21, 2026. Network assignments for Sunday afternoon games follow the visiting conference rule and can be cross-flexed. Weeks 15–18 are subject to flex scheduling; Week 18 times and networks are set in early January. Netflix games simulcast over the air only in the participating teams' home markets — none of which are these four.
  </footer>
</div>
</script>

  G.forEach(function(g,i){ g.k = i; });

  function localToday(){
    var n = new Date();
    return n.getFullYear() + '-' +
      String(n.getMonth()+1).padStart(2,'0') + '-' +
      String(n.getDate()).padStart(2,'0');
  }

  var DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  Vue.createApp({
    template: document.getElementById('tpl').innerHTML,
    data: function(){
      return {
        teams: TEAMS, order: ORDER, markets: MARKETS, games: G,
        market: 'roanoke',
        shown: ORDER.slice(),
        hidePast: false,
        onlyOTA: false,
        today: localToday()
      };
    },
    computed: {
      prettyToday: function(){ return this.fmtLong(this.today); },
      visible: function(){
        var self = this;
        return this.games.filter(function(g){
          if (!g.tm.some(function(c){ return self.shown.indexOf(c) !== -1; })) return false;
          if (self.hidePast && g.d < self.today) return false;
          if (self.onlyOTA && (g.bye || self.v(g).s !== 'yes')) return false;
          return true;
        });
      },
      gameCount: function(){ return this.visible.filter(function(g){ return !g.bye; }).length; },
      otaCount: function(){
        var self = this;
        return this.visible.filter(function(g){ return !g.bye && self.v(g).s === 'yes'; }).length;
      }
    },
    methods: {
      toggle: function(c){
        var i = this.shown.indexOf(c);
        if (i === -1) this.shown.push(c);
        else if (this.shown.length > 1) this.shown.splice(i,1);
      },
      allTeams: function(){ this.shown = ORDER.slice(); },
      isPast: function(g){ return g.d < this.today; },
      parse: function(d){
        var p = d.split('-');
        return new Date(+p[0], +p[1]-1, +p[2]);
      },
      fmt: function(d){
        var x = this.parse(d);
        return DOW[x.getDay()] + ' ' + MON[x.getMonth()] + ' ' + x.getDate();
      },
      fmtLong: function(d){
        var x = this.parse(d);
        return DOW[x.getDay()] + ', ' + MON[x.getMonth()] + ' ' + x.getDate() + ', ' + x.getFullYear();
      },
      chan: function(g){
        var n = g.net;
        if (n === 'NBC')   return 'NBC / Peacock';
        if (n === 'ESPN')  return 'ESPN';
        if (n === 'PRIME') return 'Prime / Twitch (free)';
        if (n === 'NFLX')  return 'Netflix';
        if (n === 'THX')   return g.chan;
        if (n === 'INTL')  return 'International';
        if (n === 'SAT')   return 'Saturday — network TBD';
        if (n === 'TBD')   return 'TBD';
        return n;
      },
      v: function(g){
        if (g.bye) return {s:'no', note:''};
        var m = MARKETS[this.market], home = m.home;
        var homeName = TEAMS[home].name;
        var mine = g.tm.indexOf(home) !== -1;

        if (g.net === 'NBC')  return {s:'yes', note:m.st.NBC + ' — national'};
        if (g.net === 'THX')  return {s:'yes', note:m.st[g.chan] + ' — national'};
        if (g.net === 'ESPN') return {s:'no',  note:'unless ABC simulcasts'};
        if (g.net === 'PRIME')return {s:'no',  note:'free on Twitch'};
        if (g.net === 'NFLX') return {s:'no',  note:'OTA only in participating markets'};
        if (g.net === 'SAT')  return {s:'maybe', note:'network not announced'};
        if (g.net === 'TBD')  return {s:'maybe', note:'flexed — set in January'};
        if (g.net === 'INTL') {
          return mine ? {s:'yes', note:'home-market game'}
                      : {s:'maybe', note:'morning games go near-national'};
        }
        // FOX or CBS Sunday afternoon
        if (mine) return {s:'yes', note:m.st[g.net]};
        var blocked = G.some(function(x){
          return !x.bye && x.d === g.d && x.net === g.net && x.ts === g.ts &&
                 x.tm.indexOf(home) !== -1;
        });
        if (blocked) return {s:'no', note:homeName + ' have this window'};
        return {s:'maybe', note:'open window — regional pick'};
      }
    }
  }).mount('#app');
